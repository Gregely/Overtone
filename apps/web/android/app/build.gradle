apply plugin: 'com.android.application'

// ONE place for the package id, app name and version: apps/web/app.config.json
// (also read by capacitor.config.ts). Change "appId" there to rebrand the package.
def appConfig = new groovy.json.JsonSlurper().parse(rootProject.file('../app.config.json'))

// Release signing: android/keystore.properties (git-ignored; see `npm run android:keystore`)
// or OVERTONE_KEYSTORE_* environment variables. Without either, only debug builds are signed.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> System.getenv(env) ?: keystoreProps.getProperty(key) }
def releaseStoreFile = signingValue('storeFile', 'OVERTONE_KEYSTORE_FILE')

android {
    namespace = "app.overtone.player"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId appConfig.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appConfig.versionCode
        versionName appConfig.versionName
        resValue "string", "app_name", appConfig.appName
        resValue "string", "title_activity_main", appConfig.appName
        resValue "string", "package_name", appConfig.appId
        resValue "string", "custom_url_scheme", appConfig.appId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'OVERTONE_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'OVERTONE_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'OVERTONE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        resValues true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // Native playback (foreground service, notification, audio focus, gapless queue).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google services / Firebase: Overtone ships without analytics or push SDKs.
